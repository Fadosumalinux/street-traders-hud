<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ST LABS COCKPIT v6.5.1</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:monospace;font-size:11px;letter-spacing:1px;}
body{background:#000;color:#FF8C00;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden;}
.cockpit-container{width:980px;height:460px;background:#000;border:2px solid #FF8C00;border-radius:35px;padding:30px;display:grid;grid-template-columns:200px 1fr 200px;gap:20px;box-shadow:0 0 30px rgba(255,140,0,0.25);}
.side-panel{display:flex;flex-direction:column;justify-content:space-between;gap:18px;padding:15px;background:repeating-linear-gradient(45deg,#0d0d0d,#0d0d0d 4px,#141414 4px,#141414 8px);border:1px solid #222;border-radius:16px;height:100%;}
.section-lbl{font-size:8px;color:#666;text-align:center;font-weight:bold;text-transform:uppercase;}
.lote-box{display:grid;grid-template-columns:35px 1fr 35px;background:#000;border:1px solid #FF8C00;border-radius:8px;height:42px;align-items:center;text-align:center;}
.btn-math{background:none;border:none;color:#FF8C00;font-size:16px;font-weight:bold;cursor:pointer;height:100%;}
.btn-action{background:#000;border:1px solid #2a2a2a;border-radius:12px;height:46px;color:#fff;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;width:100%;transition:all 0.2s;}
.btn-buy{border-color:#22c55e;color:#22c55e;}.btn-buy.active{background:rgba(34,197,94,0.15);box-shadow:0 0 15px rgba(34,197,94,0.3);}
.btn-sell{border-color:#e11d48;color:#e11d48;}.btn-sell.active{background:rgba(225,29,72,0.15);box-shadow:0 0 15px rgba(225,29,72,0.3);}
.btn-close{border-color:#eab308;color:#eab308;}
.btn-asset{background:#000;border:1px solid #444;color:#aaa;border-radius:8px;height:38px;cursor:pointer;font-weight:bold;width:100%;}
.btn-asset.active{background:#FF8C00;color:#000;border-color:#FF8C00;box-shadow:0 0 12px rgba(255,140,0,0.4);}
.btn-toggle{border-color:#3b82f6;color:#3b82f6;font-size:9px;}
.center-dash{display:flex;flex-direction:column;justify-content:space-between;gap:10px;}
.semaphore{display:flex;justify-content:center;gap:10px;margin-bottom:5px;}
.led{width:13px;height:13px;background:#1a1a1a;border-radius:50%;border:2px solid #333;cursor:pointer;}
.led.warning{background:#eab308;box-shadow:0 0 10px #eab308;border-color:#fff;animation:blink 1.2s infinite alternate;}
.led.nominal{background:#22c55e;box-shadow:0 0 12px #22c55e;border-color:#fff;}
@keyframes blink{0%{opacity:0.4;}100%{opacity:1;}}
.monitor-box{background:#050505;border:1px solid #1a1a1a;border-radius:12px;padding:15px;text-align:center;flex-grow:1;display:flex;flex-direction:column;justify-content:space-between;}
.monitor-hdr{font-size:10px;font-weight:bold;color:#fff;letter-spacing:2px;text-transform:uppercase;}
.display-row{display:flex;align-items:center;justify-content:center;gap:25px;margin:10px 0;}
.liq-container{display:flex;flex-direction:column;align-items:center;font-size:8px;color:#00e5ff;font-weight:bold;gap:4px;}
.liq-gauge{height:75px;width:14px;background:#111;border:1px solid #222;border-radius:2px;overflow:hidden;display:flex;align-items:flex-end;}
.liq-fill{width:100%;background:#00e5ff;transition:height 0.3s;box-shadow:0 0 10px #00e5ff;}
.price-text{font-size:4.4rem;font-weight:bold;color:#fff;letter-spacing:-2px;line-height:1;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sub-box{background:#000;border:1px solid #1a1a1a;padding:8px 12px;border-radius:6px;text-align:left;}
.sub-val{font-size:12px;font-weight:bold;margin-top:2px;text-transform:uppercase;}
</style></head><body><div class="cockpit-container"><div class="side-panel"><div><div class="section-lbl" style="margin-bottom:10px;">Order Management</div><div class="lote-box"><button class="btn-math" onclick="lot(-0.1)">-</button><div style="font-weight:bold; color:#fff;" id="ui-lot">LOT 1.1</div><button class="btn-math" onclick="lot(0.1)">+</button></div></div><button class="btn-action btn-buy" id="b-buy" onclick="op('BUY')">🟢 BUY</button><button class="btn-action btn-sell" id="b-sell" onclick="op('SELL')">🔴 SELL</button><button class="btn-action btn-close" onclick="cls()">⚠️ CLOSE POSITION</button></div><div class="center-dash"><div class="semaphore" id="sys-semaphore"></div><div class="monitor-box" id="main-monitor"></div></div><div class="side-panel" id="asset-pad"></div></div>
<script>
let ST={activo:"NASDAQ 100",prc:18196.4,lot:1.1,active:false,tipo:"",ent:0.0,pnl:0.0,tp:0.0,sl:0.0,bal:10000.00,vista:0,liq:55,sentiment:"ALCISTA",sesion:"NEW YORK",historial:Array(30).fill(18196.4),lista:["EUR/USD","XAU/USD","NASDAQ 100","BTC/USD","DJ30"],confluencias:[false,false,false,false,false]};
const config={"EUR/USD":{base:1.0742,dig:4,mult:100000,pipVal:0.0010,lbl:"EUR/USD | FOREX REVENUE"},"XAU/USD":{base:2348.66,dig:2,mult:100,pipVal:2.50,lbl:"XAU/USD | ST METALS"},"NASDAQ 100":{base:18196.4,dig:1,mult:10,pipVal:20.0,lbl:"NASDAQ | LIVE ENGINE"},"BTC/USD":{base:67240.5,dig:1,mult:1,pipVal:150.0,lbl:"BTC/USD | CRYPTO LIQUIDITY"},"DJ30":{base:39210.0,dig:1,mult:10,pipVal:35.0,lbl:"DJ30 | LIVE TELEMETRY"}};
function initAssets(){const pad=document.getElementById('asset-pad');if(!pad)return;pad.innerHTML='<div class="section-lbl">Asset Selector</div>';let group=document.createElement('div');group.style.display='flex';group.style.flexDirection='column';group.style.gap='10px';group.style.width='100%';ST.lista.forEach(a=>{let b=document.createElement('button');b.className='btn-asset'+(ST.activo===a?' active':'');b.innerText=a;b.onclick=()=>setAsset(a);group.appendChild(b);});pad.appendChild(group);let toggleBtn=document.createElement('button');toggleBtn.className='btn-action btn-toggle';toggleBtn.innerText='█ ALTERNAR DISPLAY';toggleBtn.onclick=()=>{ST.vista=ST.vista===0?1:0;renderCentro();};pad.appendChild(toggleBtn);}
function setAsset(a){if(ST.active)return;ST.activo=a;ST.prc=config[a].base;ST.historial=Array(30).fill(ST.prc);initAssets();actualizarInterfaz();}
function engine(){let conf=config[ST.activo];ST.prc=Number((ST.prc+conf.base*(Math.random()-0.5)*0.0006).toFixed(conf.dig));ST.historial.push(ST.prc);if(ST.historial.length>30)ST.historial.shift();ST.liq=Math.floor(Math.random()*30)+40;ST.sentiment=ST.prc>=ST.historial[ST.historial.length-2]?"ALCISTA":"BAJISTA";if(ST.active){let f=conf.mult*ST.lot;if(ST.tipo === "BUY"){ST.pnl=Number(((ST.prc-ST.ent)*f).toFixed(2));if(ST.prc>=ST.tp||ST.prc<=ST.sl)auto();}else{ST.pnl=Number(((ST.ent-ST.prc)*f).toFixed(2));if(ST.prc<=ST.tp||ST.prc>=ST.sl)auto();}}actualizarInterfaz();}
function op(t){if(ST.active||!ST.confluencias.every(v=>v))return;ST.active=true;ST.tipo=t;ST.ent=ST.prc;let conf=config[ST.activo];if(t==="BUY"){ST.tp=Number((ST.prc+conf.pipVal).toFixed(conf.dig));ST.sl=Number((ST.prc-(conf.pipVal/2)).toFixed(conf.dig));document.getElementById('b-buy').className='btn-action btn-buy active';}else{ST.tp=Number((ST.prc-conf.pipVal).toFixed(conf.dig));ST.sl=Number((ST.prc+(conf.pipVal/2)).toFixed(conf.dig));document.getElementById('b-sell').className='btn-action btn-sell active';}}
function cls(){if(!ST.active)return;ST.bal=Number((ST.bal+ST.pnl).toFixed(2));ST.active=false;ST.pnl=0;document.getElementById('b-buy').className='btn-action btn-buy';document.getElementById('b-sell').className='btn-action btn-sell';ST.confluencias=[false,false,false,false,false];}
function auto(){cls();}function lot(v){if(ST.active)return;ST.lot=Number(Math.max(0.1,ST.lot+v).toFixed(1));document.getElementById('ui-lot').innerText="LOT "+ST.lot.toFixed(1);}
function toggleLed(idx){if(ST.active)return;ST.confluencias[idx]=!ST.confluencias[idx];actualizarInterfaz();}
function renderCentro(){const container=document.getElementById('main-monitor');if(!container)return;let conf=config[ST.activo],colorSent=ST.sentiment==="ALCISTA"?"#00e5ff":"#e11d48",eq=Number((ST.bal+ST.pnl).toFixed(2)),allOk=ST.confluencias.every(v=>v);let txtTitulo=ST.vista===0?"ST LABS JS-ENGINE":"ST LABS COCKPIT v6.5.1",txtStatus="ESPERANDO BOXES / VALIDACION DE ESTRATEGIA",colorStatus="#aaa";if(allOk){txtStatus="SETUP VALIDADO // READY TO EXECUTE";colorStatus="#22c55e";}if(ST.active){txtStatus=`ORDEN ${ST.tipo} ACTIVE // PNL: $${ST.pnl.toFixed(2)}`;colorStatus=ST.pnl>=0?"#22c55e":"#e11d48";}let valorRiesgo=Math.abs(ST.bal*0.01).toFixed(2);let targetTP=ST.active?`+$${(valorRiesgo*2)} (1%)`:"READY (1%)",targetSL=ST.active?`-$${valorRiesgo} (1%)`:"READY (1%)";
if(ST.vista===0){container.innerHTML=`<div><div class="monitor-hdr">${txtTitulo}</div><div style="font-size:9px; color:${colorStatus}; font-weight:bold; margin-top:4px; text-transform:uppercase;">${txtStatus}</div></div><div class="display-row"><div class="liq-container"><div>LIQ</div><div class="liq-gauge"><div class="liq-fill" style="height:${ST.liq}%"></div></div></div><div style="text-align: center;"><div class="price-text">${ST.prc.toFixed(conf.dig)}</div><div class="section-lbl" style="color:#aaa; margin-top:6px; font-weight:bold;">${conf.lbl}</div></div></div><div class="info-grid"><div class="sub-box"><div class="lbl" style="color:#666;">PILOTO OPERANDO</div><div class="sub-val" style="color:#eab308;">INSTITUCIONAL</div></div><div class="sub-box"><div class="lbl" style="color:#666;">MARKET SENTIMENT</div><div class="sub-val" style="color:${colorSent};">${ST.sentiment}</div></div><div class="sub-box"><div class="lbl" style="color:#666;">SESSION TIMING</div><div class="sub-val" style="color:#3b82f6;">${ST.sesion}</div></div><div class="sub-box"><div class="lbl" style="color:#666;">EQUITY / PNL</div><div class="sub-val" style="color:${ST.pnl>=0?'#22c55e':'#e11d48'};">$${eq.toFixed(2)}</div></div></div>`;}
else{container.innerHTML=`<div><div class="monitor-hdr">${txtTitulo}</div><div style="font-size:9px; color:${colorStatus}; font-weight:bold; margin-top:4px; text-transform:uppercase;">${txtStatus}</div></div><div class="display-row"><div class="liq-container"><div>LIQ/VOL</div><div class="liq-gauge"><div class="liq-fill" style="height:${ST.liq}%"></div></div></div><div style="text-align: center;"><div class="price-text">${ST.prc.toFixed(conf.dig)}</div><div class="section-lbl" style="color:#aaa; margin-top:6px; font-weight:bold;">${conf.lbl}</div></div></div><div class="info-grid" style="grid-template-columns: 1fr 1fr; margin-bottom:10px;"><div class="sub-box"><div class="lbl" style="color:#22c55e;">T/P TARGET (1%)</div><div class="sub-val" style="color:#22c55e;">${targetTP}</div></div><div class="sub-box"><div class="lbl" style="color:#e11d48;">S/L TARGET (1%)</div><div class="sub-val" style="color:#e11d48;">${targetSL}</div></div></div><div style="height:60px; width:100%; border:1px solid #1a1a1a; border-radius:8px; padding:4px; overflow:hidden;"><canvas id="live-canvas" style="width:100%; height:100%"></canvas></div>`;drawChart();}}
function drawChart(){const canvas=document.getElementById('live-canvas');if(!canvas)return;const ctx=canvas.getContext('2d');canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle=ST.active?(ST.pnl>=0?'#22c55e':'#e11d48'):'#FF8C00';ctx.lineWidth=2;ctx.beginPath();let step=canvas.width/(ST.historial.length-1),min=Math.min(...ST.historial),max=Math.max(...ST.historial);ST.historial.forEach((p,i)=>{let x=i*step,y=max===min?canvas.height/2:canvas.height-((p-min)/(max-min))*(canvas.height-10)-5;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
function actualizarInterfaz(){renderCentro();const semContainer=document.getElementById('sys-semaphore');if(semContainer){semContainer.innerHTML='';const allOk=ST.confluencias.every(v=>v);ST.confluencias.forEach((val,i)=>{let led=document.createElement('div');led.className='led'+(val?(allOk?' nominal':' warning'):'');led.onclick=()=>toggleLed(i);semContainer.appendChild(led);});}}
window.onload=function(){initAssets();actualizarInterfaz();setInterval(engine,350);};
</script></body></html>
